<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的侧边栏</title>
    <style>
      body {
        min-width: 200px;
        padding: 10px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        color: #1f1f1f;
      }
      h1 {
        font-size: 16px;
        color: #333;
        margin-bottom: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background-color: #f6f8fa;
        color: #24292f;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.2s ease;
      }
      .btn:hover {
        background-color: #eef1f4;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      #tabs-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .new-tab-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        border-radius: 6px;
        border: 1px dashed #d0d7de;
        background-color: #ffffff;
        color: #2563eb;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s ease, border-color 0.2s ease,
          color 0.2s ease;
      }
      .new-tab-btn:hover {
        background-color: #eff6ff;
        border-color: #93c5fd;
        color: #1d4ed8;
      }
      .new-tab-btn:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      .new-tab-btn__icon {
        font-size: 18px;
        line-height: 1;
        font-weight: 600;
      }
      .tab-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 6px;
        transition: background-color 0.2s ease;
        cursor: pointer;
        font-size: 14px;
      }
      .tab-item:hover {
        background-color: #f1f5ff;
      }
      .tab-item--active {
        background-color: #e7efff;
      }
      .tab-icon {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background-color: #edf2f7;
        color: #3b3f45;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .tab-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .tab-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-grow: 1;
        margin-right: 6px;
      }
      .tab-title--muted {
        color: #6b7280;
      }
      .close-tab-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        color: #6b7280;
        border-radius: 4px;
      }
      .close-tab-btn:hover {
        background-color: rgba(239, 68, 68, 0.08);
        color: #ef4444;
      }
      .reload-tab-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 2px 4px;
        color: #6b7280;
        border-radius: 4px;
      }
      .reload-tab-btn:hover {
        background-color: rgba(55, 148, 255, 0.12);
        color: #3794FF;
      }
      .empty-state {
        font-size: 13px;
        color: #6b7280;
        text-align: center;
        padding: 12px 0;
      }
      .context-menu {
        position: fixed;
        z-index: 2000;
        min-width: 200px;
        background-color: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
        padding: 4px 0;
        display: none;
        color: #111827;
      }
      .context-menu__item {
        width: 100%;
        border: none;
        background: transparent;
        padding: 6px 16px;
        text-align: left;
        font-size: 13px;
        color: inherit;
        cursor: pointer;
        transition: background-color 0.2s ease;
        outline: none;
      }
      .context-menu__item:hover {
        background-color: #edf2ff;
      }
      .context-menu__item--disabled,
      .context-menu__item[disabled] {
        color: #c0c6d1;
        cursor: not-allowed;
      }
      .context-menu__item--disabled:hover,
      .context-menu__item[disabled]:hover {
        background-color: transparent;
      }
      .context-menu__separator {
        height: 1px;
        background-color: #e5e7eb;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="toggle-fullscreen-btn" class="btn">切换全屏</button>
      <button id="set-zoom-btn" class="btn">设置全局缩放</button>
    </div>
    <div id="tabs-container"></div>
    <div
      id="custom-context-menu"
      class="context-menu"
      role="menu"
      aria-hidden="true"
    ></div>
    <script src="TagSidebar.js"></script>
  </body>
</html>
